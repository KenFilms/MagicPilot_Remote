[platformio]
default_envs = m5stack-core2

[env]
; Pinned to arduino-esp32 2.0.17. The firmware uses the Bluedroid GATT client, and newer
; arduino-esp32 3.3.x builds ship NimBLE instead of Bluedroid for the ESP32-S3 (CoreS3).
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.2.11
; Adds the "merged" target: pio run -e <env> -t merged
extra_scripts = post:scripts/merge_firmware.py

[env:m5stack-core2]
board = m5stack-core2

[env:m5stack-cores3]
board = m5stack-cores3
lib_deps =
    ${env.lib_deps}
    https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/1205/LTR5XX.zip
