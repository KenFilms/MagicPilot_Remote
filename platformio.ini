[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.2.11

[env:m5stack-core2]
board = m5stack-core2

[env:m5stack-cores3]
board = m5stack-cores3
lib_deps =
    ${env.lib_deps}
    https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/1205/LTR5XX.zip